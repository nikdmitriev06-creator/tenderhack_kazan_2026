<text x="1160" y="516" text-anchor="middle" fill="#17191c">Принять заявку?</text>
<rect x="1260" y="435" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="1330" y="472" text-anchor="middle" fill="#17191c">Опубликовать СТЕ в</text>
